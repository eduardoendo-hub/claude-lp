server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* nao deveria existir nesta LP (a integracao vive em rd.technowhub.ai).
    # Retornar 404 explicito + X-Robots-Tag noindex pra desindexar caso o Google
    # ja tenha pego /api/leads (que estava sendo servido como a landing inteira).
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    # /admin/ idem — nao existe aqui
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    # Raiz: serve index.html (a LP). Qualquer outro path:
    # - serve o arquivo real se existir (sitemap.xml, robots.txt, favicon.ico,
    #   llms.txt, assets, etc)
    # - retorna 404 se nao existir (em vez de devolver a LP como fallback,
    #   o que estava poluindo o indice do Google com URLs falsas)
    location / {
        try_files $uri $uri/ =404;
    }

    # Headers de cache curtos pra arquivos SEO-criticos (pra Google ver versao fresca)
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /llms.txt {
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=300" always;
    }

    gzip on;
    gzip_types text/html text/css text/plain text/xml application/javascript image/svg+xml application/json;
}
