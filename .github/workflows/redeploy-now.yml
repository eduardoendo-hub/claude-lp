name: Redeploy LP (manual)

# Dispara redeploy da LP via Deploy Webhook do Coolify sob demanda.
# Serve de "botao de panico" quando o webhook GitHub-Coolify esta travado.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_LP }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "secret COOLIFY_DEPLOY_WEBHOOK_LP nao setado"
            exit 1
          fi
          http_code=$(curl -sS -o /tmp/out -w "%{http_code}" "$WEBHOOK_URL")
          echo "HTTP $http_code"
          echo "--- body ---"
          cat /tmp/out
          echo
          echo "--- /body ---"
          case "$http_code" in
            2??) echo "✓ deploy disparado — veja o build no Coolify" ;;
            *)   echo "✗ falhou"; exit 1 ;;
          esac
