name: Redeploy LP (manual)

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        env:
          WEBHOOK_URL:   ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_LP }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "secret COOLIFY_DEPLOY_WEBHOOK_LP ausente"
            exit 1
          fi
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "secret COOLIFY_TOKEN ausente (necessario — a URL do webhook e' a URL da API /api/v1/deploy e precisa Bearer)"
            exit 1
          fi
          http_code=$(curl -sS -o /tmp/out -w "%{http_code}" \
            -X GET "$WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json")
          echo "HTTP $http_code"
          echo "--- body ---"
          cat /tmp/out
          echo
          echo "--- /body ---"
          case "$http_code" in
            2??) echo "✓ deploy disparado — veja o build no Coolify" ;;
            *)   echo "✗ falhou"; exit 1 ;;
          esac
