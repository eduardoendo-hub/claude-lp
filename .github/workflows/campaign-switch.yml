name: Campaign switch

# Roda diariamente 00:05 BRT (= 03:05 UTC, UTC-3 sem DST).
# Se houver switch em campaigns-schedule.json pra hoje, aplica via
# scripts/campaign-switch.mjs. Motor (commit + push + redeploy Coolify)
# vive em eduardoendo-hub/lp-automation (composite action).

on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: eduardoendo-hub/lp-automation/.github/actions/campaign-switch@main
        with:
          switch-script:      scripts/campaign-switch.mjs
          coolify-deploy-url: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_LP }}
          coolify-token:      ${{ secrets.COOLIFY_TOKEN }}
